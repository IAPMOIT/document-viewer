name: Publish NPM Package

on:
  push:
    branches:
      - release
    paths:
      - 'packages/**'
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@iapmoit'
          
      - name: Configure npm authentication
        run: |
          echo "@OWNER:registry=https://npm.pkg.github.com/" >> ~/.npmrc
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.IAPMO_DEPLOY_TOKEN }}" >> ~/.npmrc
          echo "//npm.pkg.github.com/:username=${{ secrets.IAPMO_DEPLOY_USER }}" >> ~/.npmrc

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build required dependencies
        run: |
          npx nx build docviewhelper

      - name: Lint Angular document viewer
        run: |
          npx nx lint ngx-doc-viewer

      - name: Build demo applications (validation)
        run: |
          npx nx build demo-angular --configuration=production

      - name: Prepare and publish document-viewer
        run: |
          # Copy source files and create publishable package
          mkdir -p publish-temp/ngx-doc-viewer
          cp -r packages/ngx-doc-viewer/* publish-temp/ngx-doc-viewer/
          cd publish-temp/ngx-doc-viewer
          # For Angular libraries published as source, set the main entry to the TypeScript index
          # and let consuming applications handle the TypeScript compilation
          npm pkg set main="src/index.ts"
          npm pkg set types="src/index.ts"
          npm publish

  publish-on-tag:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@iapmoit'
          
      - name: Configure npm authentication
        run: |
          echo "@OWNER:registry=https://npm.pkg.github.com/" >> ~/.npmrc
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.IAPMO_DEPLOY_TOKEN }}" >> ~/.npmrc
          echo "//npm.pkg.github.com/:username=${{ secrets.IAPMO_DEPLOY_USER }}" >> ~/.npmrc

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build required dependencies
        run: npx nx build docviewhelper

      - name: Prepare and publish document-viewer with tag
        run: |
          # Prepare and publish ngx-doc-viewer from source
          mkdir -p publish-temp/ngx-doc-viewer
          cp -r packages/ngx-doc-viewer/* publish-temp/ngx-doc-viewer/
          cd publish-temp/ngx-doc-viewer
          npm pkg set main="src/index.ts"
          npm pkg set types="src/index.ts"
          npm publish --tag latest
